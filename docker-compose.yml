version: "3.9"

services:
  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    container_name: novamindd-web
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    container_name: novamindd-db
    environment:
      POSTGRES_USER: novamindd
      POSTGRES_PASSWORD: novamindd
      POSTGRES_DB: novamindd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novamindd"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: novamindd-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://novamindd:novamindd@db:5432/novamindd
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      SECRET_KEY: change-me-in-production
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  sandbox-builder:
    build:
      context: sandbox/images
      dockerfile: Dockerfile
    image: novamindd-sandbox:latest
    entrypoint: ["echo", "Sandbox image built"]

volumes:
  pgdata:
